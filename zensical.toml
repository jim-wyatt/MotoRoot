# Documentation site. Preview:  docs   (in the dev shell)   or   dev\.venv-docs\Scripts\zensical serve
# Build:  dev\.venv-docs\Scripts\zensical build --strict --clean   ->  site\ (git-ignored)
# Published by .github/workflows/docs.yml to GitHub Pages on every push to main.

[project]
site_name = "MotoRoot"
site_description = "An Android platform development environment built around a Moto G Power 2026 (XT2617V) development device"
site_url = "https://jim-wyatt.github.io/MotoDev/"
copyright = "Original guide &copy; 2026 parsimo2010 (MIT). Docs and dev environment for this fork."
repo_url = "https://github.com/jim-wyatt/MotoDev"
repo_name = "jim-wyatt/MotoDev"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "start/index.md",
    { "Set up the dev environment" = "start/setup.md" },
    { "Tour the repository" = "start/repo-tour.md" },
    { "Your first ADB session" = "start/first-adb-session.md" },
  ] },
  { "Android internals" = [
    "concepts/index.md",
    { "ADB and Fastboot" = "concepts/adb-and-fastboot.md" },
    { "Partitions and A/B slots" = "concepts/partitions-and-slots.md" },
    { "The boot chain" = "concepts/boot-chain.md" },
    { "System-level access" = "concepts/system-access.md" },
    { "System modules with Magisk" = "concepts/magisk-modules.md" },
    { "Device provisioning" = "concepts/device-provisioning.md" },
  ] },
  { "Prepare the device" = [
    "device/index.md",
    { "Preparation walkthrough" = "device/walkthrough.md" },
    { "Maintaining the device" = "device/maintenance.md" },
  ] },
  { "Develop" = [
    "develop/index.md",
    { "Write a system helper" = "develop/helper-programs.md" },
    { "Build a system module" = "develop/magisk-modules.md" },
    { "Inspect app packages" = "develop/inspecting-apps.md" },
    { "Native code with the NDK" = "develop/native-code.md" },
    { "Your first app in Android Studio" = "develop/android-studio.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Dev environment" = "reference/environment.md" },
    { "Git workflow" = "reference/git-workflow.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Glossary" = "reference/glossary.md" },
    { "Credits and sources" = "reference/credits.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/smartphone"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
