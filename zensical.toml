# Documentation site. Preview:  aosp-academy docs        Build:  aosp-academy docs build   ->  site/ (git-ignored)
# Published by .github/workflows/docs.yml to GitHub Pages on every push to main.

[project]
site_name = "aosp-academy"
site_description = "Bootstrap and maintain a Moto G Power 2026 (XT2617V) as an AOSP development device: an independent, educational project"
site_url = "https://jim-wyatt.github.io/aosp-academy/"
copyright = "&copy; 2026 Jim Wyatt, MIT. An independent, non-commercial educational project, not affiliated with any manufacturer, carrier or software vendor. Device procedure derived from parsimo2010's guide (MIT). Use is subject to the <a href='https://jim-wyatt.github.io/aosp-academy/reference/disclaimer/'>disclaimer</a>."
repo_url = "https://github.com/jim-wyatt/aosp-academy"
repo_name = "jim-wyatt/aosp-academy"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "start/index.md",
    { "Set up a workstation" = "start/workstation.md" },
    { "Set up a build node" = "start/build-node.md" },
    { "Your first session" = "start/first-session.md" },
  ] },
  { "Develop apps" = [
    "apps/index.md",
    { "What the device gives you" = "apps/the-image.md" },
    { "An Android Studio project" = "apps/android-studio.md" },
    { "Debug any process" = "apps/debugging.md" },
    { "Trace with Perfetto" = "apps/tracing.md" },
    { "Instrument with Frida" = "apps/instrumentation.md" },
    { "Native code with the NDK" = "apps/native-code.md" },
    { "Inspect app packages" = "apps/inspecting-apps.md" },
  ] },
  { "Change the environment" = [
    "environment/index.md",
    { "What's in the image" = "environment/image.md" },
    { "Build the image" = "environment/building.md" },
    { "Deploy and verify" = "environment/deploying.md" },
    { "Move to a new AOSP release" = "environment/tag-moves.md" },
    { "Validation" = "environment/validation.md" },
    { "Backlog" = "environment/backlog.md" },
  ] },
  { "The device" = [
    "device/index.md",
    { "Hardware" = "device/hardware.md" },
    { "Preparation walkthrough" = "device/walkthrough.md" },
    { "The stock system" = "device/stock.md" },
    { "System helpers" = "device/helpers.md" },
    { "System modules" = "device/modules.md" },
    { "DSU, GSIs and going back to stock" = "device/dsu.md" },
  ] },
  { "How Android works" = [
    "concepts/index.md",
    { "ADB and Fastboot" = "concepts/adb-and-fastboot.md" },
    { "Partitions and A/B slots" = "concepts/partitions-and-slots.md" },
    { "The boot chain" = "concepts/boot-chain.md" },
    { "System-level access" = "concepts/system-access.md" },
    { "System modules with Magisk" = "concepts/magisk-modules.md" },
    { "Device provisioning" = "concepts/device-provisioning.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Commands" = "reference/cli.md" },
    { "Pins (toolchain.json)" = "reference/pins.md" },
    { "Decisions" = "reference/decisions.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Git workflow" = "reference/git-workflow.md" },
    { "Glossary" = "reference/glossary.md" },
    { "Credits and sources" = "reference/credits.md" },
    { "Disclaimer" = "reference/disclaimer.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/smartphone"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
