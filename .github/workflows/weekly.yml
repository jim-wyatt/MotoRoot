name: Weekly

# What drifts without a commit here. Runs every Monday (and on demand), never on PRs:
#   pins      every pinned URL in toolchain.json still resolves; files up to 150 MB still match
#   links     the docs' external links still work (lychee, a pinned release, checksum verified)
#   new-app   aosp-academy new-app --build still builds on a clean runner (AGP, Gradle, the SDK)
#   upstream  newer AOSP tags, SDK packages, platform-tools, AGP or Gradle than the pins
# A failure opens (or comments on) one issue; new upstream releases keep one issue up to date.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I .github/scripts/weekly.py pins

  links:
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
    steps:
      - uses: actions/checkout@v4
      - name: External links in the docs and README (internal links are checked by the strict docs build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Links to this repository's own files are files in the checkout, and github.com throttles
          # runners on them (503): excluded below.
          f=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$f"
          echo "$LYCHEE_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          ./lychee --no-progress --max-retries 3 --retry-wait-time 10 --accept '200..=299,403,429' \
            --scheme https --scheme http \
            --exclude 'example\.(com|invalid)' --exclude '192\.0\.2\.' --exclude 'localhost' --exclude '127\.0\.0\.1' \
            --exclude 'github\.com/jim-wyatt/aosp-academy/(blob|tree)/' \
            'docs/**/*.md' README.md

  new-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: The pinned SDK packages the template compiles against
        run: |
          plat=$(python -c "import json; print(next(p for p in json.load(open('toolchain.json'))['androidSdk']['packages'] if p.startswith('platforms/')).replace('/', ';'))")
          bt=$(python -c "import json; print(next(p for p in json.load(open('toolchain.json'))['androidSdk']['packages'] if p.startswith('build-tools/')).replace('/', ';'))")
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$plat" "$bt" >/dev/null
      - name: aosp-academy new-app --build
        run: ./aosp-academy new-app "$RUNNER_TEMP/app" --package com.example.weekly --build

  upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I .github/scripts/weekly.py upstream --out "$RUNNER_TEMP/upstream.md"
      - name: Keep one issue listing them up to date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream releases newer than the pins"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -s "$RUNNER_TEMP/upstream.md" ]; then
            { echo "The weekly check found releases newer than \`toolchain.json\`. Not every one should be taken: see docs/reference/pins.md (Changing a pin) and docs/environment/tag-moves.md."; echo; cat "$RUNNER_TEMP/upstream.md"; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > body.md
            if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Everything is current as of $(date -u +%F)."
          fi

  report:
    needs: [pins, links, new-app]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on the weekly-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Weekly check failed"
          msg="$(date -u +%F): pins=${{ needs.pins.result }}, links=${{ needs.links.result }}, new-app=${{ needs.new-app.result }}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"; else gh issue create --title "$title" --body "$msg"; fi
