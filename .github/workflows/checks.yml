name: Checks

# Fast checks that need no Android SDK, device or AOSP tree: the Magisk module builder and its
# committed ZIPs, every shell script (syntax, ShellCheck errors, LF line endings), the aosp_academy
# package's unit tests and its CLI. The full self-test (aosp-academy check) runs on a set-up workstation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Module builder tests (committed ZIPs rebuild byte-identically)
        run: python -m unittest discover -s stock/modules -p "test_*.py" -v

      - name: toolchain.json is valid JSON
        run: python -c "import json; json.load(open('toolchain.json'))"

      - name: Shell scripts use LF line endings
        run: |
          bad=$(git ls-files '*.sh' '.githooks/*' | xargs grep -l $'\r' || true)
          if [ -n "$bad" ]; then echo "CRLF line endings (bash and Android's sh choke on them):"; echo "$bad"; exit 1; fi

      - name: Shell scripts parse (bash -n)
        run: |
          for f in $(git ls-files '*.sh' '.githooks/*'); do bash -n "$f" || exit 1; done

      - name: Pre-commit hook blocks device data, keys and traces (and passes ordinary files)
        run: bash .githooks/test-pre-commit.sh

      - name: ShellCheck (errors only)
        run: |
          git ls-files '*.sh' '.githooks/*' | xargs shellcheck --severity=error --shell=bash

      - name: Package unit tests (no phone, no network)
        run: python -I -m unittest discover -s tests -v

      - name: The CLI loads and lists its commands
        run: ./aosp-academy --help
